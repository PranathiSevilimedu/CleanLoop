name: cleanloop
description: "CleanLoop - Waste to Resource AI Mobile and Web Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Icons & Styling
  cupertino_icons: ^1.0.8

  # Supabase Integration for Auth & Database
  supabase_flutter: ^2.5.4

  # Cross-platform Camera & Media Support
  camera: ^0.10.6
  camera_web: ^0.3.2
  cross_file: ^0.3.3+8

  # Mapping & Location Services
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset management configuration
  # assets:
  #   - assets/images/